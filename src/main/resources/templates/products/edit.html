
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 수정</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .container-box {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
        }

        .footer-box {
            margin-top: 80px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="container-box">

        <h2 class="fw-bold mb-4">
            상품 수정
        </h2>

        <form th:action="@{/products/{id}/edit(id=${productId})}"
              method="post"
              th:object="${productDto}">

            <!-- 상품명 -->
            <div class="mb-3">

                <label class="form-label">
                    상품명
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{name}">

            </div>

            <!-- 가격 -->
            <div class="mb-3">

                <label class="form-label">
                    가격
                </label>

                <input type="number"
                       class="form-control"
                       th:field="*{price}">

            </div>

            <!-- 설명 -->
            <div class="mb-3">

                <label class="form-label">
                    설명
                </label>

                <textarea class="form-control"
                          rows="4"
                          th:field="*{description}">
                </textarea>

            </div>

            <!-- 재고 -->
            <div class="mb-3">

                <label class="form-label">
                    재고
                </label>

                <input type="number"
                       class="form-control"
                       th:field="*{stock}">

            </div>

            <button type="submit"
                    class="btn btn-primary">
                수정 완료
            </button>

            <a th:href="@{/products}"
               class="btn btn-secondary">
                목록으로
            </a>

        </form>

    </div>

    <!-- Footer -->
    <footer class="footer-box">

        <p th:text="${'실습 수행 일시 : '
            + #temporals.format(
                #temporals.createNow(),
                'yyyy-MM-dd HH:mm:ss')}">
        </p>

        <p>
            학번 : 2171381 |
            성명 : 지경태
        </p>

    </footer>

</div>

</body>
</html>
