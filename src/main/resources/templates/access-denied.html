<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접근 거부</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .error-box {
            max-width: 600px;
            margin: 120px auto;
            background: white;
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,.1);
            text-align: center;
        }

        .error-code {
            font-size: 72px;
            font-weight: bold;
            color: #dc3545;
        }

        .footer-box {
            margin-top: 40px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="error-box">

        <div class="error-code">
            403
        </div>

        <h2 class="mb-3">
            접근이 거부되었습니다.
        </h2>

        <p class="text-muted mb-4">
            관리자만 접근 가능한 페이지입니다.
        </p>

        <a href="/home" class="btn btn-primary">
            홈으로 이동
        </a>

        <div class="footer-box">

            <p th:text="${'실습 수행 일시 : '
                + #temporals.format(
                    #temporals.createNow(),
                    'yyyy-MM-dd HH:mm:ss')}">
            </p>

            <p>
                학번 : 2171381 |
                성명 : 지경태
            </p>

        </div>

    </div>

</div>

</body>
</html>
