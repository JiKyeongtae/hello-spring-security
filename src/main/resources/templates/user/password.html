<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: linear-gradient(135deg, #f8f9fa, #eef2ff);
            min-height: 100vh;
        }

        .password-card {
            max-width: 600px;
            margin: 60px auto;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        .card-header {
            background: linear-gradient(90deg, #1a1a2e, #0f3460);
            color: white;
            padding: 24px;
        }

        .card-header h3 {
            font-weight: 700;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,.15);
        }

        .btn-primary {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }

        .footer-box {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card password-card">

        <div class="card-header">
            <h3 class="mb-0">
                비밀번호 변경
            </h3>
        </div>

        <div class="card-body p-4">

            <form th:action="@{/user/password}"
                  method="post"
                  th:object="${passwordChangeDto}">

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        현재 비밀번호
                    </label>

                    <input type="password"
                           class="form-control"
                           th:field="*{currentPassword}"
                           placeholder="현재 비밀번호 입력">

                    <div class="text-danger mt-1 small"
                         th:if="${#fields.hasErrors('currentPassword')}"
                         th:errors="*{currentPassword}">
                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        새 비밀번호
                    </label>

                    <input type="password"
                           class="form-control"
                           th:field="*{newPassword}"
                           placeholder="8자 이상 입력">

                    <div class="text-danger mt-1 small"
                         th:if="${#fields.hasErrors('newPassword')}"
                         th:errors="*{newPassword}">
                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        새 비밀번호 확인
                    </label>

                    <input type="password"
                           class="form-control"
                           th:field="*{confirmPassword}"
                           placeholder="새 비밀번호 다시 입력">

                    <div class="text-danger mt-1 small"
                         th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}">
                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary w-100">

                    비밀번호 변경

                </button>

            </form>

            <div class="footer-box">

                <p th:text="${'실습 수행 일시 : '
                    + #temporals.format(
                        #temporals.createNow(),
                        'yyyy-MM-dd HH:mm:ss')}">
                </p>

                <p>
                    학번 : 2171381 |
                    성명 : 지경태
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
